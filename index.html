<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Tracker</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body{
            background: linear-gradient(180deg,#FFF7FB,#FDEFF7,#F9E7F4);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:430px;
            background:#ffffff;
            border-radius:30px;
            padding:30px;
            text-align:center;
            box-shadow:0 12px 30px rgba(233,30,99,.10);
        }

        .logo{
            width:220px;
            margin:10px auto 20px;
            display:block;
        }

        h1{
            color:#6D4C57;
            font-size:34px;
            margin-bottom:12px;
        }

        p{
            color:#8C6C79;
            line-height:1.7;
            margin-bottom:28px;
            font-size:15px;
        }

        .btn{
            width:100%;
            background:#F48FB1;
            color:white;
            border:none;
            padding:15px;
            border-radius:16px;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#EC6F9D;
        }

        footer{
            margin-top:24px;
            color:#A18894;
            font-size:13px;
        }
    </style>
</head>

<body>

<div class="container">

    <img src="images/mental-health.png" alt="Mental Health Tracker" class="logo">

    <h1>Mental Health Tracker</h1>

    <p>
        Selamat datang di aplikasi <b>Mental Health Tracker</b>.
        Aplikasi ini membantu kamu mencatat mood harian,
        memantau tingkat stres, melihat statistik,
        serta mempelajari konsep <b>Graph, BFS, DFS,
        Searching, Sorting, dan Big O</b>.
    </p>

    <button class="btn" onclick="window.location.href='login.html'">
        🚀 Mulai Sekarang
    </button>

    <footer>
        © 2026 Mental Health Tracker
    </footer>

</div>

</body>
</html>
