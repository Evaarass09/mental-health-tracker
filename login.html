<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Mental Health Tracker</title>

<link rel="stylesheet" href="css/style.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(180deg,#FFF7FB,#FDEFF7,#F9E7F4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    background:#FFFFFF;
    border-radius:30px;
    padding:30px;
    box-shadow:0 12px 30px rgba(233,30,99,.10);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#F8BBD0;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 20px;
    font-size:40px;
}

h1{
    color:#6D4C57;
    margin-bottom:10px;
}

p{
    color:#8C6C79;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #F8D7E6;
    border-radius:16px;
    margin-bottom:16px;
    font-size:15px;
    background:#FFF9FB;
}

input:focus{
    outline:none;
    border-color:#F48FB1;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:16px;
    background:#F48FB1;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#EC77A3;
}

a{
    color:#C2185B;
    text-decoration:none;
}

footer{
    margin-top:20px;
    color:#A18894;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🧠</div>

<h1>Selamat Datang</h1>

<p>Masuk ke akun Mental Health Tracker</p>

<form onsubmit="login(event)">

<input
    type="text"
    id="username"
    placeholder="Username"
    required>

<input
    type="password"
    id="password"
    placeholder="Password"
    required>

<button type="submit">Masuk</button>

</form>

<br>

<a href="index.html">⬅ Kembali ke Beranda</a>

<footer>
    © 2026 Mental Health Tracker
</footer>

</div>

<script src="js/script.js"></script>

</body>
</html>
